<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Snapshot Test</title>
    <script>
      window.render = (source, options, scale) => {
        const doc = mockblocks.parse(source, {
          languages: options.lang ? ["en", options.lang] : ["en"],
        })

        const view = mockblocks.newView(doc, {
          style: options.style,
          scale: options.scale,
        })
        // Need to add manually if calling View#render (folks, this is why you shouldn't use private API!)
        const svg = view.render()
        svg.classList.add(`mockblocks-style-${options.style}`)

        return new Promise(function (resolve) {
          view.toCanvas(function (canvas) {
            resolve(canvas.toDataURL("image/png"))
          }, scale)
        })
      }

      import("../browser.js")
        .then(() => fetch("../locales/de.json"))
        .then(res => res.json())
        .then(de => mockblocks.loadLanguages({ de }))
        .then(() => {
          // Bundled packs are registered for every snapshot, so the existing
          // snapshots also check that a pack does not change Scratch blocks.
          mockblocks.registerPack(mockblocks.packs.jscratch)
          window.mockblocksLoaded = true
        })
    </script>
  </head>
  <body></body>
</html>
